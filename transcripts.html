<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案库 - 抖音文案提取器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-input: #252525;
            --primary: #ff2d55;
            --secondary: #00d4aa;
            --accent: #ffd60a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border: #333333;
            --success: #34c759;
            --warning: #ff9500;
            --error: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 导航 */
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .nav a:hover {
            color: var(--text-primary);
            background: var(--bg-input);
        }

        .nav a.active {
            color: var(--bg-dark);
            background: var(--primary);
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
        }

        /* 统计和工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #ff6b7a);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 45, 85, 0.4);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--secondary), #00f5c4);
            color: var(--bg-dark);
        }

        .btn-danger {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
        }

        .btn-danger:hover {
            background: var(--error);
            color: white;
        }

        /* 搜索框 */
        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* 文案列表 */
        .transcript-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .transcript-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }

        .transcript-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 15px;
        }

        .transcript-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        /* 作者信息卡片 */
        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-input);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: var(--bg-dark);
        }

        .author-avatar-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .author-details {
            flex: 1;
        }

        .author-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .author-name a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .author-name a:hover {
            color: var(--primary);
        }

        .author-signature {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 300px;
        }

        .author-stats {
            font-size: 0.8rem;
            color: var(--secondary);
        }

        .btn-refresh-author {
            margin-top: 8px;
            padding: 4px 10px;
            font-size: 0.75rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-refresh-author:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-refresh-author:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .video-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(255, 45, 85, 0.15);
            color: var(--primary);
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .video-link:hover {
            background: var(--primary);
            color: white;
        }

        .transcript-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .transcript-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .transcript-content {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 15px;
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-primary);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .transcript-content::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-content::-webkit-scrollbar-track {
            background: var(--bg-dark);
            border-radius: 3px;
        }

        .transcript-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .transcript-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            background: rgba(255, 45, 85, 0.15);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .transcript-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .btn-small {
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        /* 导出弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--border);
        }

        .modal h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .export-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .export-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .export-option:hover {
            border-color: var(--primary);
            background: var(--bg-dark);
        }

        .export-option .icon {
            font-size: 2rem;
        }

        .export-option .info {
            flex: 1;
        }

        .export-option .name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .export-option .desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .modal-close {
            margin-top: 20px;
            width: 100%;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
            background: rgba(52, 199, 89, 0.15);
        }

        .toast.error {
            border-color: var(--error);
            background: rgba(255, 59, 48, 0.15);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                justify-content: center;
            }

            .actions {
                justify-content: center;
            }

            .search-box {
                max-width: 100%;
            }

            .transcript-header {
                flex-direction: column;
            }
        }
    </style>
    <script src="auth-check.js"></script>
</head>
<body>
    <div class="container">
        <!-- 导航 -->
        <nav class="nav" style="display: flex; align-items: center; flex-wrap: wrap;">
            <a href="index.html">🎬 文案提取</a>
            <a href="authors.html">👤 作者监控</a>
            <a href="transcripts.html" class="active">📝 文案库</a>
            <a href="predictions.html">⚽ 球赛预测</a>
            <span style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                <span id="user-info" style="color: var(--text-secondary); font-size: 13px;"></span>
                <button onclick="logout()" style="background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">退出</button>
            </span>
        </nav>
        <script>
            window.addEventListener('authReady', (e) => {
                document.getElementById('user-info').textContent = '👤 ' + (e.detail.nickname || e.detail.username);
            });
        </script>

        <!-- 头部 -->
        <header class="header">
            <h1>📝 文案库</h1>
            <p>所有提取的文案都会自动保存在这里</p>
        </header>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总文案数</div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜索文案内容、标题、作者...">
            </div>

            <div class="actions">
                <button class="btn btn-success" onclick="showExportModal()">
                    📤 导出全部
                </button>
                <button class="btn btn-secondary" onclick="refreshList()">
                    🔄 刷新
                </button>
                <button class="btn btn-danger" onclick="clearAllTranscripts()">
                    🗑️ 清空
                </button>
            </div>
        </div>

        <!-- 文案列表 -->
        <div class="transcript-list" id="transcriptList">
            <div class="empty-state">
                <div class="icon">📝</div>
                <h3>暂无文案</h3>
                <p>提取视频文案后会自动保存到这里</p>
            </div>
        </div>
    </div>

    <!-- 导出弹窗 -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h3>选择导出格式</h3>
            <div class="export-options">
                <div class="export-option" onclick="exportTranscripts('txt')">
                    <div class="icon">📄</div>
                    <div class="info">
                        <div class="name">TXT 纯文本</div>
                        <div class="desc">易于阅读，适合打印</div>
                    </div>
                </div>
                <div class="export-option" onclick="exportTranscripts('json')">
                    <div class="icon">📊</div>
                    <div class="info">
                        <div class="name">JSON 数据</div>
                        <div class="desc">包含完整信息，适合开发</div>
                    </div>
                </div>
                <div class="export-option" onclick="exportTranscripts('csv')">
                    <div class="icon">📈</div>
                    <div class="info">
                        <div class="name">CSV 表格</div>
                        <div class="desc">可用 Excel 打开编辑</div>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary modal-close" onclick="hideExportModal()">取消</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let allTranscripts = [];

        // 页面加载
        document.addEventListener('DOMContentLoaded', () => {
            loadTranscripts();
            
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterTranscripts(e.target.value);
            });
        });

        // 加载文案列表
        async function loadTranscripts() {
            try {
                const response = await fetch('/api/transcripts');
                const data = await response.json();
                
                if (data.success) {
                    allTranscripts = data.data;
                    document.getElementById('totalCount').textContent = data.count;
                    renderTranscripts(allTranscripts);
                }
            } catch (error) {
                console.error('加载文案失败:', error);
                showToast('加载文案失败', 'error');
            }
        }

        // 渲染文案列表
        function renderTranscripts(transcripts) {
            const container = document.getElementById('transcriptList');
            
            if (!transcripts || transcripts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>暂无文案</h3>
                        <p>提取视频文案后会自动保存到这里</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = transcripts.map(t => `
                <div class="transcript-item" data-id="${t.id || t.videoId}">
                    <div class="transcript-header">
                        <div class="transcript-title">${escapeHtml(t.title) || '无标题'}</div>
                        ${t.url ? `<a href="${escapeHtml(t.url)}" target="_blank" class="video-link">🎬 查看原视频</a>` : ''}
                    </div>
                    
                    <!-- 作者信息卡片 -->
                    <div class="author-info">
                        ${t.authorAvatar 
                            ? `<img src="${escapeHtml(t.authorAvatar)}" alt="头像" class="author-avatar" onerror="this.outerHTML='<div class=\\'author-avatar-placeholder\\'>👤</div>'">`
                            : `<div class="author-avatar-placeholder">👤</div>`
                        }
                        <div class="author-details">
                            <div class="author-name">
                                ${t.author 
                                    ? (t.authorSecUid 
                                        ? `<a href="https://www.douyin.com/user/${escapeHtml(t.authorSecUid)}" target="_blank">${escapeHtml(t.author)} ↗</a>`
                                        : escapeHtml(t.author))
                                    : (t.url 
                                        ? `<a href="${escapeHtml(t.url)}" target="_blank" style="color: var(--text-secondary);">点击查看原视频 ↗</a>`
                                        : '未知作者')
                                }
                            </div>
                            ${t.authorSignature ? `<div class="author-signature">${escapeHtml(t.authorSignature)}</div>` : ''}
                            ${t.authorFollowers ? `<div class="author-stats">粉丝: ${formatNumber(t.authorFollowers)}</div>` : ''}
                            ${!t.author && t.videoId ? `<button class="btn-refresh-author" onclick="refreshAuthorInfo('${t.id}')" title="重新获取作者信息">🔄 获取作者</button>` : ''}
                        </div>
                    </div>
                    
                    <div class="transcript-meta">
                        <span>🕐 ${formatDate(t.createdAt)}</span>
                        <span>🎯 ${t.modelUsed || 'small'} 模型</span>
                    </div>
                    <div class="transcript-content">${escapeHtml(t.transcript) || '(无文案内容)'}</div>
                    ${t.hashtags && t.hashtags.length > 0 ? `
                        <div class="transcript-tags">
                            ${t.hashtags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="transcript-actions">
                        <button class="btn btn-secondary btn-small" onclick="copyTranscript('${t.id || t.videoId}')">
                            📋 复制
                        </button>
                        <button class="btn btn-danger btn-small" onclick="deleteTranscript('${t.id || t.videoId}')">
                            🗑️ 删除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 搜索过滤
        function filterTranscripts(keyword) {
            if (!keyword.trim()) {
                renderTranscripts(allTranscripts);
                return;
            }

            const filtered = allTranscripts.filter(t => {
                const searchText = `${t.title || ''} ${t.author || ''} ${t.transcript || ''} ${(t.hashtags || []).join(' ')}`.toLowerCase();
                return searchText.includes(keyword.toLowerCase());
            });

            renderTranscripts(filtered);
        }

        // 刷新列表
        function refreshList() {
            loadTranscripts();
            showToast('已刷新', 'success');
        }

        // 复制文案
        function copyTranscript(id) {
            const transcript = allTranscripts.find(t => (t.id || t.videoId) === id);
            if (!transcript) return;

            const text = `【${transcript.title || '无标题'}】\n作者: ${transcript.author || '未知'}\n\n${transcript.transcript || ''}`;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                showToast('复制失败', 'error');
            });
        }

        // 重新获取作者信息
        async function refreshAuthorInfo(id) {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '获取中...';
            
            try {
                const response = await fetch(`/api/transcripts/refresh-author/${id}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('作者信息已更新', 'success');
                    loadTranscripts();
                } else {
                    showToast(data.message || '获取失败，请稍后重试', 'error');
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            } catch (error) {
                showToast('网络错误', 'error');
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // 删除单个文案
        async function deleteTranscript(id) {
            if (!confirm('确定要删除这条文案吗？')) return;

            try {
                const response = await fetch(`/api/transcripts/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('已删除', 'success');
                    loadTranscripts();
                } else {
                    showToast(data.message || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        // 清空所有文案
        async function clearAllTranscripts() {
            if (!confirm('确定要清空所有文案吗？此操作不可撤销！')) return;
            if (!confirm('再次确认：这将删除所有保存的文案！')) return;

            try {
                const response = await fetch('/api/transcripts/clear', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('已清空所有文案', 'success');
                    loadTranscripts();
                } else {
                    showToast(data.message || '清空失败', 'error');
                }
            } catch (error) {
                showToast('清空失败', 'error');
            }
        }

        // 显示导出弹窗
        function showExportModal() {
            if (allTranscripts.length === 0) {
                showToast('没有文案可导出', 'error');
                return;
            }
            document.getElementById('exportModal').classList.add('active');
        }

        // 隐藏导出弹窗
        function hideExportModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        // 导出文案
        function exportTranscripts(format) {
            hideExportModal();
            
            // 直接下载文件
            const link = document.createElement('a');
            link.href = `/api/transcripts/export?format=${format}`;
            link.click();
            
            showToast(`正在导出 ${format.toUpperCase()} 文件...`, 'success');
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        // 格式化数字（如粉丝数）
        function formatNumber(num) {
            if (!num) return '0';
            num = parseInt(num);
            if (num >= 10000000) {
                return (num / 10000000).toFixed(1) + '千万';
            } else if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toLocaleString();
        }

        // HTML 转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Toast 提示
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 点击弹窗外部关闭
        document.getElementById('exportModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                hideExportModal();
            }
        });
    </script>
</body>
</html>

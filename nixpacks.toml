# Nixpacks 配置 - Railway 自动构建
[phases.setup]
nixPkgs = [
    "nodejs_18",
    "python311",
    "python311Packages.pip",
    "ffmpeg-full",
    "chromium"
]

[phases.install]
cmds = [
    "npm install",
    "python3 -m pip install --user openai-whisper || echo 'Whisper install skipped'"
]

[start]
cmd = "node server.js"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
PYTHONUNBUFFERED = "1"

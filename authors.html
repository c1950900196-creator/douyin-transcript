<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者监控 - 抖音文案提取器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fe2c55;
            --primary-dark: #d41942;
            --secondary: #25f4ee;
            --bg-dark: #0a0a0a;
            --bg-card: #161616;
            --bg-input: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a8a8a8;
            --border: #2a2a2a;
            --success: #00d26a;
            --warning: #ffa500;
            --gradient: linear-gradient(135deg, var(--primary) 0%, #ff6b81 50%, var(--secondary) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .bg-gradient-1 { background: var(--primary); top: -200px; right: -100px; }
        .bg-gradient-2 { background: var(--secondary); bottom: -200px; left: -100px; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .grid-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        h1 {
            font-size: 2rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .status-bar {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.inactive { background: var(--text-secondary); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            background: var(--primary);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .author-list {
            display: grid;
            gap: 16px;
        }

        .author-item {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .author-item:hover {
            border-color: var(--primary);
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .author-info {
            flex: 1;
            min-width: 0;
        }

        .author-name {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .author-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .author-stats {
            display: flex;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .author-actions {
            display: flex;
            gap: 8px;
        }

        .video-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .video-actions span {
            color: var(--secondary);
        }

        .extract-progress {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .extract-progress .progress-text {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--secondary);
        }

        .extract-progress .progress-bar {
            height: 8px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
        }

        .extract-progress .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff6b9d);
            transition: width 0.3s;
        }

        .video-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-title {
            flex: 1;
            font-size: 0.95rem;
        }

        .video-author {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .video-actions-inline {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-link {
            padding: 4px 8px;
            text-decoration: none;
            font-size: 1rem;
        }

        .btn-extract {
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .btn-extract:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-extract:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(0, 255, 100, 0.1);
            border-color: rgba(0, 255, 100, 0.3);
            color: #00ff64;
        }

        .video-time {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .video-transcript {
            color: var(--secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .log-list {
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-secondary);
        }

        .log-type {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0 8px;
        }

        .log-type.add { background: var(--success); color: black; }
        .log-type.remove { background: var(--primary); color: white; }
        .log-type.check_start, .log-type.check_complete { background: var(--secondary); color: black; }
        .log-type.new_videos { background: var(--warning); color: black; }
        .log-type.error { background: var(--primary); color: white; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(0, 210, 106, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(254, 44, 85, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="auth-check.js"></script>
</head>
<body>
    <div class="background">
        <div class="bg-gradient bg-gradient-1"></div>
        <div class="bg-gradient bg-gradient-2"></div>
        <div class="grid-bg"></div>
    </div>

    <div class="container">
        <header>
            <nav class="nav-links" style="display: flex; align-items: center; flex-wrap: wrap;">
                <a href="index.html">🎬 文案提取</a>
                <a href="authors.html" class="active">👤 作者监控</a>
                <a href="transcripts.html">📝 文案库</a>
                <a href="predictions.html">⚽ 球赛预测</a>
                <span style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                    <span id="user-info" style="color: var(--text-secondary); font-size: 13px;"></span>
                    <button onclick="logout()" style="background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">退出</button>
                </span>
            </nav>
            <script>
                window.addEventListener('authReady', (e) => {
                    document.getElementById('user-info').textContent = '👤 ' + (e.detail.nickname || e.detail.username);
                });
            </script>
            <h1>👤 作者监控</h1>
            <p class="subtitle">自动监控抖音作者，每6小时检查更新并提取文案</p>
        </header>

        <!-- 状态栏 -->
        <div class="card">
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="monitorDot"></div>
                    <span id="monitorStatus">监控中</span>
                </div>
                <div class="status-item">
                    <span>👤</span>
                    <span>监控作者: <strong id="authorCount">0</strong></span>
                </div>
                <div class="status-item">
                    <span>🎬</span>
                    <span>已抓取视频: <strong id="videoCount">0</strong></span>
                </div>
                <div class="status-item">
                    <span>⏰</span>
                    <span>检查间隔: <strong>6小时</strong></span>
                </div>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                <button class="btn" onclick="loginDouyin()" id="loginBtn" style="background: var(--bg-hover); color: var(--text);">
                    🔑 登录抖音
                </button>
                <span id="loginStatus" style="font-size: 0.85rem; color: var(--text-secondary);">检查中...</span>
                <span style="border-left: 1px solid var(--border); margin: 0 8px; height: 24px;"></span>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                    <input type="checkbox" id="polishToggle" onchange="togglePolish(this.checked)" checked style="width: 16px; height: 16px; cursor: pointer;">
                    <span>✨ 豆包润色</span>
                </label>
                <span id="polishStatus" style="font-size: 0.8rem; color: var(--text-secondary);">已启用</span>
                <span style="border-left: 1px solid var(--border); margin: 0 8px; height: 24px;"></span>
                <button class="btn btn-secondary" onclick="checkNow()">
                    🔄 立即检查更新
                </button>
            </div>
        </div>

        <!-- 工作状态面板（常态显示） -->
        <div id="taskPanel" class="card" style="border-left: 3px solid var(--primary);">
            <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="taskIcon">💤</span>
                    <span>工作状态</span>
                </div>
                <span id="taskStatusBadge" style="font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; background: var(--bg-hover); color: var(--text-secondary);">空闲</span>
            </div>
            <div id="taskStatus" style="padding: 10px 0;">
                <div id="taskProgressContainer" style="display: none;">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                        <div id="taskProgress" style="flex: 1; height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden;">
                            <div id="taskProgressFill" style="height: 100%; background: var(--gradient); width: 0%; transition: width 0.3s;"></div>
                        </div>
                        <span id="taskProgressText" style="color: var(--secondary); font-weight: 500; min-width: 45px;">0%</span>
                    </div>
                </div>
                <div id="taskMessage" style="color: var(--text-secondary); font-size: 0.9rem;">系统空闲，等待任务...</div>
                <div id="taskDetails" style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 8px;"></div>
            </div>
        </div>

        <!-- 添加作者 -->
        <div class="card">
            <div class="card-title">
                <span>➕</span>
                <span>添加作者</span>
            </div>
            <div id="addAlert" class="alert"></div>
            <div class="input-group">
                <input type="text" id="authorInput" placeholder="粘贴抖音作者主页链接，例如：https://www.douyin.com/user/xxxxx">
                <button class="btn btn-primary" id="addBtn" onclick="addAuthor()">
                    <span>➕</span>
                    <span>添加</span>
                </button>
            </div>
            <p style="color: var(--text-secondary); font-size: 0.85rem;">
                💡 在抖音 App 中点击作者头像，进入主页后点击右上角「分享」→「复制链接」
            </p>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('authors')">👤 监控列表</button>
            <button class="tab" onclick="switchTab('videos')">🎬 抓取的视频</button>
            <button class="tab" onclick="switchTab('logs')">📋 监控日志</button>
        </div>

        <!-- 作者列表 -->
        <div id="authorsTab" class="tab-content active">
            <div class="card">
                <div id="authorList" class="author-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">👤</div>
                        <p>还没有添加作者</p>
                        <p>添加作者后将自动监控其更新</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视频列表 -->
        <div id="videosTab" class="tab-content">
            <div class="card">
                <div class="video-actions">
                    <span id="videoListCount">0 个视频</span>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" onclick="updateVideoTitles()" id="updateTitlesBtn" style="background: var(--bg-hover); color: var(--text);">🔄 更新标题</button>
                        <button class="btn btn-primary" onclick="extractAllTranscripts()" id="extractAllBtn">📝 批量提取文案</button>
                    </div>
                </div>
                <div id="extractProgress" class="extract-progress" style="display: none;">
                    <div class="progress-text">正在提取: <span id="extractCurrent">0</span>/<span id="extractTotal">0</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="extractFill" style="width: 0%"></div>
                    </div>
                </div>
                <div id="videoList" class="video-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <p>还没有抓取到视频</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日志 -->
        <div id="logsTab" class="tab-content">
            <div class="card">
                <div id="logList" class="log-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>暂无日志</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin; // 自动适配部署环境
        let taskPollInterval = null;

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', () => {
            loadStatus();
            loadAuthors();
            loadVideos();
            loadLogs();
            checkTaskStatus(); // 检查任务状态
            checkLoginStatus(); // 检查登录状态
            checkPolishStatus(); // 检查润色状态

            // 每30秒刷新状态
            setInterval(loadStatus, 30000);
            
            // 每2秒检查任务状态（常态轮询）
            taskPollInterval = setInterval(checkTaskStatus, 2000);
        });
        
        // 上次任务完成状态，用于刷新数据
        let lastTaskComplete = false;
        
        // 检查任务状态（常态显示）
        async function checkTaskStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/monitor/task`);
                const data = await res.json();
                
                if (data.success && data.data) {
                    const task = data.data;
                    const progressContainer = document.getElementById('taskProgressContainer');
                    const progressFill = document.getElementById('taskProgressFill');
                    const progressText = document.getElementById('taskProgressText');
                    const message = document.getElementById('taskMessage');
                    const details = document.getElementById('taskDetails');
                    const taskIcon = document.getElementById('taskIcon');
                    const statusBadge = document.getElementById('taskStatusBadge');
                    
                    if (task.isRunning) {
                        // 任务运行中
                        progressContainer.style.display = 'block';
                        taskIcon.textContent = '⏳';
                        statusBadge.textContent = '运行中';
                        statusBadge.style.background = 'var(--gradient)';
                        statusBadge.style.color = 'white';
                        
                        progressFill.style.width = task.progress + '%';
                        progressText.textContent = task.progress + '%';
                        message.textContent = task.message || '处理中...';
                        
                        let detailText = '';
                        if (task.currentAuthor) {
                            detailText += `作者: ${task.currentAuthor}`;
                        }
                        if (task.currentVideo) {
                            detailText += detailText ? ' | ' : '';
                            detailText += `视频: ${task.currentVideo.substring(0, 25)}...`;
                        }
                        if (task.totalVideos > 0) {
                            detailText += detailText ? ' | ' : '';
                            detailText += `进度: ${task.completedVideos}/${task.totalVideos}`;
                        }
                        details.textContent = detailText;
                        
                        lastTaskComplete = false;
                    } else if (task.progress === 100 && !lastTaskComplete) {
                        // 任务刚完成
                        progressContainer.style.display = 'block';
                        taskIcon.textContent = '✅';
                        statusBadge.textContent = '已完成';
                        statusBadge.style.background = '#10b981';
                        statusBadge.style.color = 'white';
                        
                        progressFill.style.width = '100%';
                        progressText.textContent = '100%';
                        message.textContent = task.message || '✅ 任务完成';
                        details.textContent = '';
                        
                        // 刷新数据
                        loadStatus();
                        loadVideos();
                        loadLogs();
                        
                        lastTaskComplete = true;
                        
                        // 5秒后恢复空闲状态
                        setTimeout(() => {
                            showIdleState();
                        }, 5000);
                    } else if (!task.isRunning && task.progress !== 100) {
                        // 空闲状态
                        showIdleState();
                    }
                }
            } catch (e) {
                // 网络错误时显示离线状态
                const taskIcon = document.getElementById('taskIcon');
                const statusBadge = document.getElementById('taskStatusBadge');
                const message = document.getElementById('taskMessage');
                
                taskIcon.textContent = '⚠️';
                statusBadge.textContent = '离线';
                statusBadge.style.background = '#ef4444';
                statusBadge.style.color = 'white';
                message.textContent = '无法连接服务器...';
            }
        }
        
        // 显示空闲状态
        function showIdleState() {
            const progressContainer = document.getElementById('taskProgressContainer');
            const taskIcon = document.getElementById('taskIcon');
            const statusBadge = document.getElementById('taskStatusBadge');
            const message = document.getElementById('taskMessage');
            const details = document.getElementById('taskDetails');
            
            progressContainer.style.display = 'none';
            taskIcon.textContent = '💤';
            statusBadge.textContent = '空闲';
            statusBadge.style.background = 'var(--bg-hover)';
            statusBadge.style.color = 'var(--text-secondary)';
            message.textContent = '系统空闲，等待任务...';
            details.textContent = '';
        }

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            // 切换到对应标签页时加载数据
            if (tab === 'videos') {
                loadVideos();
            } else if (tab === 'logs') {
                loadLogs();
            } else if (tab === 'authors') {
                loadAuthors();
            }
        }

        // 加载状态
        async function loadStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/monitor/status`);
                const data = await res.json();
                
                if (data.success) {
                    const status = data.data;
                    document.getElementById('authorCount').textContent = status.authorCount;
                    document.getElementById('videoCount').textContent = status.videoCount;
                    
                    const dot = document.getElementById('monitorDot');
                    const statusText = document.getElementById('monitorStatus');
                    
                    if (status.isRunning) {
                        dot.classList.remove('inactive');
                        statusText.textContent = '监控中';
                    } else {
                        dot.classList.add('inactive');
                        statusText.textContent = '已停止';
                    }
                }
            } catch (e) {
                console.error('加载状态失败:', e);
            }
        }

        // 加载作者列表
        async function loadAuthors() {
            try {
                const res = await fetch(`${API_BASE}/api/authors`);
                const data = await res.json();
                
                const container = document.getElementById('authorList');
                
                if (!data.success || !data.data.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👤</div>
                            <p>还没有添加作者</p>
                            <p>添加作者后将自动监控其更新</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = data.data.map(author => `
                    <div class="author-item">
                        <div class="author-avatar" style="${author.avatar ? `background-image: url(${author.avatar}); background-size: cover;` : ''}">
                            ${author.avatar ? '' : '👤'}
                        </div>
                        <div class="author-info">
                            <div class="author-name">${author.nickname || '未知作者'}</div>
                            <div class="author-meta">
                                ${author.followerCount ? `<span style="color: var(--primary);">👥 ${formatNumber(author.followerCount)} 粉丝</span>` : ''}
                                ${author.videoCount ? `<span style="margin-left: 12px;">🎬 ${author.videoCount} 视频</span>` : ''}
                            </div>
                            <div class="author-meta" style="margin-top: 4px; font-size: 0.8rem;">
                                ${author.signature ? author.signature.substring(0, 40) : ''}
                            </div>
                        </div>
                        <div class="author-stats" style="flex-direction: column; align-items: flex-end; gap: 4px;">
                            <span>添加于 ${formatDate(author.addedAt)}</span>
                            ${author.lastChecked ? `<span>上次检查 ${formatDate(author.lastChecked)}</span>` : ''}
                            <a href="${author.url}" target="_blank" style="color: var(--secondary); font-size: 0.8rem;">🔗 主页</a>
                        </div>
                        <div class="author-actions">
                            <button class="btn btn-danger" onclick="removeAuthor('${author.uid || author.secUid}')">
                                删除
                            </button>
                        </div>
                    </div>
                `).join('');
                
            } catch (e) {
                console.error('加载作者失败:', e);
            }
        }

        // 加载视频列表
        async function loadVideos() {
            try {
                const res = await fetch(`${API_BASE}/api/videos`);
                const data = await res.json();
                
                const container = document.getElementById('videoList');
                
                if (!data.success || !data.data.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎬</div>
                            <p>还没有抓取到视频</p>
                        </div>
                    `;
                    return;
                }
                
                // 保持原始顺序（新视频已在数组开头）
                const videos = data.data;
                
                // 更新视频计数
                document.getElementById('videoListCount').textContent = `${videos.length} 个视频`;
                
                container.innerHTML = videos.slice(0, 100).map(video => {
                    const vid = video.videoId || video.id; // 兼容两种字段名
                    return `
                    <div class="video-item" data-video-id="${vid}" data-video-url="https://www.douyin.com/video/${vid}">
                        <div class="video-title">
                            <div>${video.title || '无标题'}</div>
                            <div class="video-author">${video.authorNickname || ''}</div>
                        </div>
                        <div class="video-actions-inline">
                            <a href="https://www.douyin.com/video/${vid}" target="_blank" class="btn-link">🔗</a>
                            <button class="btn-extract" onclick="extractSingleVideo('${vid}')" ${video.hasTranscript ? 'disabled' : ''}>
                                ${video.hasTranscript ? '✅ 已提取' : '📝 提取'}
                            </button>
                        </div>
                    </div>
                `}).join('');
                
            } catch (e) {
                console.error('加载视频失败:', e);
            }
        }

        // 加载日志
        async function loadLogs() {
            try {
                const res = await fetch(`${API_BASE}/api/monitor/logs?limit=50`);
                const data = await res.json();
                
                const container = document.getElementById('logList');
                
                if (!data.success || !data.data.length) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>暂无日志</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = data.data.map(log => {
                    // 构建错误详情显示
                    let errorDetail = '';
                    if (log.type === 'error' && log.data && log.data.error) {
                        errorDetail = `<span style="color: #ef4444; margin-left: 8px; font-size: 0.85rem;">（${log.data.error}）</span>`;
                    }
                    
                    return `
                        <div class="log-item">
                            <span class="log-time">${formatDateTime(log.time)}</span>
                            <span class="log-type ${log.type}">${log.type}</span>
                            <span>${log.message}${errorDetail}</span>
                        </div>
                    `;
                }).join('');
                
            } catch (e) {
                console.error('加载日志失败:', e);
            }
        }

        // 添加作者
        async function addAuthor() {
            const input = document.getElementById('authorInput');
            const btn = document.getElementById('addBtn');
            const alert = document.getElementById('addAlert');
            
            const url = input.value.trim();
            if (!url) {
                showAlert(alert, 'error', '请输入作者主页链接');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div><span>添加中...</span>';
            
            try {
                const res = await fetch(`${API_BASE}/api/authors`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showAlert(alert, 'success', `✅ ${data.message}${data.videoCount ? `，获取到 ${data.videoCount} 个视频` : ''}`);
                    input.value = '';
                    loadAuthors();
                    loadVideos();
                    loadStatus();
                } else {
                    showAlert(alert, 'error', data.error || '添加失败');
                }
            } catch (e) {
                showAlert(alert, 'error', '服务连接失败');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>➕</span><span>添加</span>';
            }
        }

        // 删除作者
        async function removeAuthor(authorId) {
            if (!confirm('确定要删除这个作者吗？')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/authors/${authorId}`, {
                    method: 'DELETE'
                });
                
                const data = await res.json();
                
                if (data.success) {
                    loadAuthors();
                    loadStatus();
                } else {
                    alert(data.error || '删除失败');
                }
            } catch (e) {
                alert('服务连接失败');
            }
        }

        // 检查登录状态
        async function checkLoginStatus() {
            const statusEl = document.getElementById('loginStatus');
            try {
                const res = await fetch(`${API_BASE}/api/auth/status`);
                const data = await res.json();
                
                if (data.success) {
                    if (data.isLoggedIn) {
                        statusEl.innerHTML = '<span style="color: #10b981;">✅ 已登录</span>';
                    } else {
                        statusEl.innerHTML = '<span style="color: var(--warning);">⚠️ 未登录</span>';
                    }
                } else {
                    statusEl.textContent = '状态未知';
                }
            } catch (e) {
                statusEl.textContent = '检查失败';
            }
        }

        // 检查豆包润色状态
        async function checkPolishStatus() {
            const toggle = document.getElementById('polishToggle');
            const statusEl = document.getElementById('polishStatus');
            try {
                const res = await fetch(`${API_BASE}/api/doubao/config`);
                const data = await res.json();
                
                if (data.success && data.data) {
                    toggle.checked = data.data.enabled;
                    statusEl.textContent = data.data.enabled ? '已启用' : '已关闭';
                    statusEl.style.color = data.data.enabled ? '#10b981' : 'var(--text-secondary)';

                console.error('检查润色状态失败:', e);
            }

        // 切换润色功能
        async function togglePolish(enabled) {
            const statusEl = document.getElementById('polishStatus');
            statusEl.textContent = '更新中...';
            
            try {
                const res = await fetch(`${API_BASE}/api/doubao/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: enabled })
                });
                const data = await res.json();
                
                if (data.success) {
                    statusEl.textContent = enabled ? '已启用' : '已关闭';

                } else {
                    showExtractToast('更新失败: ' + data.error, 'error');
                }
            } catch (e) {
                showExtractToast('请求失败: ' + e.message, 'error');
            }
        }

        // 登录抖音
        async function loginDouyin() {
            const btn = document.getElementById('loginBtn');
            const statusEl = document.getElementById('loginStatus');
            btn.disabled = true;
            btn.innerHTML = '⏳ 正在打开浏览器...';
            statusEl.textContent = '等待登录...';
            
            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST'
                });
                const data = await res.json();
                
                if (data.success) {
                    showExtractToast('浏览器已打开，请在浏览器中登录抖音账号，登录完成后关闭浏览器窗口', 'info');
                    btn.innerHTML = '⏳ 等待登录...';

                    setTimeout(async () => {
                        btn.disabled = false;
                        btn.innerHTML = '🔑 登录抖音';

                    }, 5000);
                } else {
                    showExtractToast('打开浏览器失败: ' + data.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '🔑 登录抖音';
                    statusEl.textContent = '打开失败';
                }
            } catch (e) {
                showExtractToast('请求失败: ' + e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '🔑 登录抖音';
                statusEl.textContent = '请求失败';
            }

        // 立即检查更新
        async function checkNow() {
            try {
                const res = await fetch(`${API_BASE}/api/monitor/check`, {
                    method: 'POST'
                });
                const data = await res.json();
                alert(data.message || '开始检查更新...');
                
                // 延迟几秒后刷新日志
                setTimeout(() => {
                    loadLogs();
                    loadVideos();
                }, 3000);

            }

        // 显示提示
        function showAlert(el, type, message) {
            el.className = `alert alert-${type} show`;
            el.textContent = message;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // Toast 提示函数
        function showExtractToast(message, type = 'info') {
            // 创建 toast 元素
            let toast = document.getElementById('extractToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'extractToast';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    padding: 12px 24px;
                    border-radius: 8px;
                    color: white;
                    font-size: 14px;
                    z-index: 10000;
                    transition: opacity 0.3s;
                `;
                document.body.appendChild(toast);
            }
            
            toast.style.background = type === 'error' ? '#ff4757' : type === 'success' ? '#2ed573' : '#3742fa';
            toast.textContent = message;
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        // 单个视频提取文案
        async function extractSingleVideo(videoId) {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ 提取中...';
            
            try {
                const videoUrl = `https://www.douyin.com/video/${videoId}`;
                
                // 使用 POST 请求流式 API
                const response = await fetch(`${API_BASE}/api/transcribe-stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: videoUrl,
                        model: 'medium'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let result = null;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.progress !== undefined) {
                                    btn.textContent = `${data.progress}%`;
                                }
                                // 检查完成状态（返回格式是 {success: true, data: {transcript: "..."}}）
                                if (data.success !== undefined) {
                                    result = data;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                if (result && result.success && result.data && result.data.transcript) {
                    btn.textContent = '✅ 已提取';
                    showExtractToast('文案提取成功！', 'success');
                    // 标记视频已提取
                    markVideoExtracted(videoId);
                } else {
                    btn.textContent = '📝 提取';
                    btn.disabled = false;
                    const errorMsg = (result && result.error) ? result.error : '提取失败，请重试';
                    showExtractToast(errorMsg, 'error');
                }
            } catch (e) {
                console.error('提取失败:', e);
                btn.textContent = '📝 提取';
                btn.disabled = false;
                showExtractToast('提取失败: ' + e.message, 'error');
            }
        }

        // 标记视频已提取
        function markVideoExtracted(videoId) {
            const item = document.querySelector(`[data-video-id="${videoId}"]`);
            if (item) {
                const btn = item.querySelector('.btn-extract');
                if (btn) {
                    btn.textContent = '✅ 已提取';
                    btn.disabled = true;
                }
            }
        }

        // 更新视频标题
        async function updateVideoTitles() {
            const btn = document.getElementById('updateTitlesBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 更新中...';
            
            try {
                const res = await fetch(`${API_BASE}/api/monitor/update-titles`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showExtractToast('开始更新标题，请稍候...', 'info');
                    // 5秒后刷新视频列表
                    setTimeout(() => {
                        loadVideos();
                        btn.disabled = false;
                        btn.innerHTML = '🔄 更新标题';
                    }, 5000);
                } else {
                    showExtractToast('更新失败: ' + data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '🔄 更新标题';
                }
            } catch (e) {
                showExtractToast('请求失败: ' + e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '🔄 更新标题';
            }
        }

        // 批量提取所有文案
        let extracting = false;
        async function extractAllTranscripts() {
            if (extracting) {
                showExtractToast('正在提取中，请等待...', 'warning');
                return;
            }
            
            const videoItems = document.querySelectorAll('.video-item[data-video-id]');
            const unextracted = Array.from(videoItems).filter(item => {
                const btn = item.querySelector('.btn-extract');
                return btn && !btn.disabled;
            });
            
            if (unextracted.length === 0) {
                showExtractToast('没有需要提取的视频');
                return;
            }
            
            if (!confirm(`确定要批量提取 ${unextracted.length} 个视频的文案吗？\n\n注意：每个视频需要数分钟处理，请耐心等待。`)) {
                return;
            }
            
            extracting = true;
            const progressSection = document.getElementById('extractProgress');
            const currentEl = document.getElementById('extractCurrent');
            const totalEl = document.getElementById('extractTotal');
            const fillEl = document.getElementById('extractFill');
            const extractBtn = document.getElementById('extractAllBtn');
            
            extractBtn.disabled = true;
            extractBtn.textContent = '⏳ 正在提取...';
            progressSection.style.display = 'block';
            totalEl.textContent = unextracted.length;
            
            let successCount = 0;
            let failCount = 0;
            
            for (let i = 0; i < unextracted.length; i++) {
                currentEl.textContent = i + 1;
                fillEl.style.width = `${((i + 1) / unextracted.length) * 100}%`;
                
                const item = unextracted[i];
                const videoId = item.dataset.videoId;
                const btn = item.querySelector('.btn-extract');
                
                try {
                    btn.textContent = '⏳ 提取中...';
                    btn.disabled = true;
                    
                    const videoUrl = `https://www.douyin.com/video/${videoId}`;
                    const response = await fetch(`${API_BASE}/api/transcribe-stream`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: videoUrl,
                            model: 'medium'
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let result = null;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const text = decoder.decode(value);
                        const lines = text.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.progress !== undefined) {
                                        btn.textContent = `${data.progress}%`;
                                    }
                                    // 检查完成状态
                                    if (data.success !== undefined) {
                                        result = data;
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                    
                    if (result && result.success && result.data && result.data.transcript) {
                        btn.textContent = '✅ 已提取';
                        successCount++;
                    } else {
                        btn.textContent = '❌ 失败';
                        btn.disabled = false;
                        failCount++;
                    }
                } catch (e) {
                    console.error('提取失败:', e);
                    btn.textContent = '❌ 失败';
                    btn.disabled = false;
                    failCount++;
                }
                
                // 每个视频之间间隔 2 秒，避免请求过快
                if (i < unextracted.length - 1) {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
            
            extracting = false;
            extractBtn.disabled = false;
            extractBtn.textContent = '📝 批量提取文案';
            progressSection.style.display = 'none';
            
            showExtractToast(`提取完成！成功: ${successCount}, 失败: ${failCount}`, 'success');
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        // 格式化日期时间
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        // 格式化数字（万、亿）
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 100000000) {
                return (num / 100000000).toFixed(1) + '亿';
            }
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toString();
        }

        // 回车键添加
        document.getElementById('authorInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addAuthor();
        });
    </script>

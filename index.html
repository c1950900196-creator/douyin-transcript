<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音视频文案提取器 - 本地离线版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fe2c55;
            --primary-dark: #d41942;
            --secondary: #25f4ee;
            --bg-dark: #0a0a0a;
            --bg-card: #161616;
            --bg-input: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a8a8a8;
            --border: #2a2a2a;
            --success: #00d26a;
            --warning: #ffa500;
            --gradient: linear-gradient(135deg, var(--primary) 0%, #ff6b81 50%, var(--secondary) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .bg-gradient-1 { background: var(--primary); top: -200px; right: -100px; }
        .bg-gradient-2 { background: var(--secondary); bottom: -200px; left: -100px; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .grid-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 64px; height: 64px;
            background: var(--gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 32px rgba(254, 44, 85, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 210, 106, 0.2);
            border: 1px solid var(--success);
            border-radius: 20px;
            color: var(--success);
            font-size: 0.8rem;
            margin-top: 12px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--bg-card);
            border-radius: 30px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        /* 一键安装按钮 */
        .one-click-install-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-left: 16px;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
            animation: pulse-glow 2s infinite;
        }

        .one-click-install-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.6);
        }

        .one-click-install-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            animation: none;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(254, 44, 85, 0.7); }
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            max-width: 600px;
            width: 90%;
            border: 1px solid var(--border);
            animation: modalIn 0.3s ease-out;
        }

        .install-modal {
            max-width: 700px;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-buttons .btn {
            padding: 12px 24px;
        }

        /* 安装进度 */
        .install-progress {
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .install-log {
            height: 300px;
            overflow-y: auto;
            padding: 16px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #aaa;
        }

        .install-log::-webkit-scrollbar {
            width: 8px;
        }

        .install-log::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .install-log::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-line.info { color: var(--secondary); }
        .log-line.success { color: var(--success); }
        .log-line.error { color: var(--primary); }
        .log-line.warning { color: var(--warning); }
        .log-line.cmd { color: #888; font-style: italic; }

        .install-status {
            padding: 16px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .install-status.installing::before {
            content: '';
            width: 16px; height: 16px;
            border: 2px solid var(--secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .install-status.success {
            color: var(--success);
        }

        .install-status.error {
            color: var(--primary);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }

        .status-dot.ok { background: var(--success); }
        .status-dot.warning { background: var(--warning); }
        .status-dot.error { background: var(--primary); }

        .main-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 36px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { margin-bottom: 20px; }

        .input-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 18px; top: 20px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 18px 18px 18px 52px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(254, 44, 85, 0.1);
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.3);
            grid-column: span 2;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(254, 44, 85, 0.4);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) { background: var(--border); }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading-spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-section {
            margin-top: 24px;
            display: none;
        }

        .progress-section.show { display: block; }

        .progress-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .progress-text span { color: var(--secondary); }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            width: 0%;
            transition: width 0.5s ease;
            animation: progress-pulse 1.5s ease-in-out infinite;
        }

        @keyframes progress-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .result-section {
            margin-top: 28px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .result-content { display: none; }
        .result-content.active { display: block; }

        .video-info {
            background: linear-gradient(135deg, rgba(254, 44, 85, 0.08) 0%, rgba(37, 244, 238, 0.08) 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(254, 44, 85, 0.2);
        }

        .video-info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
        }

        .video-info-item:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .video-info-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            min-width: 70px;
        }

        .video-info-value {
            color: var(--text-primary);
            font-size: 0.95rem;
            flex: 1;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            padding: 8px 16px;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .copy-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .copy-btn.copied {
            background: var(--success);
            border-color: var(--success);
        }

        .result-box {
            background: var(--bg-input);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border);
            line-height: 1.9;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            font-size: 1rem;
        }

        .result-box::-webkit-scrollbar { width: 6px; }
        .result-box::-webkit-scrollbar-track { background: transparent; }
        .result-box::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .transcript-text {
            font-size: 1.05rem;
            line-height: 2;
        }

        .alert-box {
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
            display: none;
            font-size: 0.95rem;
            align-items: flex-start;
            gap: 12px;
        }

        .alert-box.show { display: flex; }

        .alert-box.error {
            background: rgba(254, 44, 85, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .alert-box.warning {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .alert-box.info {
            background: rgba(37, 244, 238, 0.1);
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }

        .alert-content { flex: 1; white-space: pre-line; }

        .settings-panel {
            margin-top: 30px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border);
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .settings-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .setting-label { flex: 1; min-width: 200px; }

        .setting-label h4 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .setting-label p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .model-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-btn {
            padding: 10px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .model-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .model-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .model-btn .size {
            font-size: 0.7rem;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }

        .tips {
            margin-top: 30px;
            padding: 24px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        .tips-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips-list {
            list-style: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .tips-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .tips-list li::before {
            content: "→";
            color: var(--secondary);
        }

        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 1.6rem; }
            .main-card, .settings-panel { padding: 20px; }
            .button-group { grid-template-columns: 1fr; }
            .btn-primary { grid-column: span 1; }
            .status-bar { gap: 10px; }
            .status-item { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
    <script src="auth-check.js"></script>
    <script src="sidebar.js"></script>
</head>
<body>
    <div class="background">
        <div class="bg-gradient bg-gradient-1"></div>
        <div class="bg-gradient bg-gradient-2"></div>
        <div class="grid-bg"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo-icon">🎬</div>
            <h1>抖音视频文案提取器</h1>
            <p class="subtitle">提取视频标题、作者与描述等基础信息</p>
            <span class="badge">🧩 轻量提取 · 无语音转写</span>
        </header>

        <div class="status-bar">
            <div class="status-item" id="ffmpegItem">
                <span class="status-dot" id="ffmpegStatus"></span>
                <span>FFmpeg</span>
            </div>
            <div class="status-item" id="pythonItem">
                <span class="status-dot" id="pythonStatus"></span>
                <span>Python</span>
            </div>
            <button class="one-click-install-btn" id="oneClickInstallBtn" onclick="oneClickInstall()" style="display:none">
                🚀 一键安装缺失组件
            </button>
        </div>
        
        <!-- 安装进度弹窗 -->
        <div class="modal-overlay" id="installModal">
            <div class="modal install-modal">
                <h3 id="installModalTitle">🚀 正在安装依赖</h3>
                <div class="install-progress">
                    <div class="install-log" id="installLog"></div>
                </div>
                <div class="install-status" id="installStatus">准备中...</div>
                <div class="modal-buttons">
                    <button class="btn btn-secondary" id="closeInstallBtn" onclick="closeInstallModal()" disabled>请等待安装完成</button>
                </div>
            </div>
        </div>

        <div class="main-card">
            <div class="input-group">
                <label class="input-label">粘贴抖音分享链接</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔗</span>
                    <textarea id="linkInput" placeholder="粘贴抖音分享文本或链接，例如：
https://v.douyin.com/xxxxx/

或完整的分享文本：
7.92 复制打开抖音，看看【xxx的作品】... https://v.douyin.com/xxxxx/"></textarea>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="extractBtn" onclick="extractBasic()">
                    <span>📝</span>
                    <span>仅提取标题</span>
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <span>🗑️</span>
                    <span>清空</span>
                </button>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="progress-text" id="progressText">
                    <span>正在处理...</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="alert-box" id="alertBox">
                <span id="alertIcon">⚠️</span>
                <div class="alert-content" id="alertContent"></div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-content active" id="infoTab">
                    <div class="video-info">
                        <div class="video-info-item">
                            <span class="video-info-label">👤 作者</span>
                            <span class="video-info-value" id="authorName">-</span>
                        </div>
                        <div class="video-info-item">
                            <span class="video-info-label">📝 标题</span>
                            <span class="video-info-value" id="videoTitle">-</span>
                        </div>
                        <div class="video-info-item">
                            <span class="video-info-label">🏷️ 话题</span>
                            <span class="video-info-value" id="hashtags">-</span>
                        </div>
                    </div>
                    <div class="result-header">
                        <div class="result-title">
                            <span>📝</span>
                            <span>视频描述</span>
                        </div>
                        <button class="copy-btn" onclick="copyResult('description')">
                            <span>📋 复制</span>
                        </button>
                    </div>
                    <div class="result-box" id="descriptionBox">-</div>
                </div>
            </div>
        </div>


        <div class="tips">
            <div class="tips-title">
                <span>💡</span>
                <span>使用说明</span>
            </div>
            <ul class="tips-list">
                <li>在抖音 App 点击「分享」→「复制链接」</li>
                <li>粘贴链接后点击「仅提取标题」</li>
                <li>会返回作者、标题、话题与描述信息</li>
                <li>如需视频下载或语音转写，请使用本地完整版</li>
            </ul>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin; // 自动适配部署环境
        let currentResult = null;
        let currentPlatform = 'darwin';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkDependencies();
            await loadConfig();
        });

        async function checkDependencies() {
            try {
                const res = await fetch(`${API_BASE}/api/check-deps`);
                const data = await res.json();
                
                currentPlatform = data.data.platform || 'darwin';
                
                // FFmpeg 状态
                const ffmpegOk = data.data.ffmpeg;
                document.getElementById('ffmpegStatus').className = 
                    'status-dot ' + (ffmpegOk ? 'ok' : 'error');
                
                // Python 状态
                const pythonOk = data.data.python;
                document.getElementById('pythonStatus').className = 
                    'status-dot ' + (pythonOk ? 'ok' : 'error');
                
                // 检查是否有缺失组件，显示一键安装按钮（现在只检查FFmpeg和Python）
                const hasMissing = !ffmpegOk || !pythonOk;
                document.getElementById('oneClickInstallBtn').style.display = 
                    hasMissing ? 'inline-block' : 'none';
            } catch (e) {
                console.error('检查依赖失败:', e);
            }
        }

        let missingDeps = [];
        let isInstalling = false;

        function closeInstallModal() {
            if (!isInstalling) {
                document.getElementById('installModal').classList.remove('show');
            }
        }

        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('installLog');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateInstallStatus(message, type = 'installing') {
            const statusDiv = document.getElementById('installStatus');
            statusDiv.textContent = message;
            statusDiv.className = `install-status ${type}`;
        }

        async function oneClickInstall() {
            if (isInstalling) return;
            
            isInstalling = true;
            const modal = document.getElementById('installModal');
            const logDiv = document.getElementById('installLog');
            const closeBtn = document.getElementById('closeInstallBtn');
            const installBtn = document.getElementById('oneClickInstallBtn');
            
            // 重置状态
            logDiv.innerHTML = '';
            closeBtn.disabled = true;
            closeBtn.textContent = '请等待安装完成';
            installBtn.disabled = true;
            installBtn.textContent = '⏳ 安装中...';
            
            modal.classList.add('show');
            
            addLog('🔍 检测系统环境...', 'info');
            updateInstallStatus('正在检测缺失组件...', 'installing');
            
            try {
                // 获取缺失组件列表
                const checkRes = await fetch(`${API_BASE}/api/check-deps`);
                const checkData = await checkRes.json();
                
                const platform = checkData.data.platform;
                const platformName = platform === 'darwin' ? 'macOS' : (platform === 'win32' ? 'Windows' : 'Linux');
                addLog(`💻 检测到操作系统: ${platformName}`, 'info');
                
                const toInstall = [];
                
                if (!checkData.data.ffmpeg) {
                    toInstall.push('ffmpeg');
                    addLog('❌ FFmpeg 未安装', 'warning');
                } else {
                    addLog('✅ FFmpeg 已安装', 'success');
                }
                
                if (!checkData.data.python) {
                    toInstall.push('python');
                    addLog('❌ Python 未安装', 'warning');
                } else {
                    addLog('✅ Python 已安装', 'success');
                }
                
                if (toInstall.length === 0) {
                    addLog('🎉 所有组件已安装完毕！', 'success');
                    updateInstallStatus('所有组件已安装完毕！', 'success');
                    closeBtn.disabled = false;
                    closeBtn.textContent = '关闭';
                    installBtn.disabled = false;
                    installBtn.textContent = '🚀 一键安装缺失组件';
                    installBtn.style.display = 'none';
                    isInstalling = false;
                    return;
                }
                
                addLog(`📦 需要安装: ${toInstall.join(', ')}`, 'info');
                addLog('', 'info');
                
                // 依次安装
                for (const dep of toInstall) {
                    addLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
                    addLog(`🔧 开始安装 ${dep.toUpperCase()}...`, 'info');
                    updateInstallStatus(`正在安装 ${dep.toUpperCase()}...`, 'installing');
                    
                    try {
                        const response = await fetch(`${API_BASE}/api/install-stream`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ target: dep })
                        });
                        
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            const text = decoder.decode(value);
                            const lines = text.split('\n').filter(l => l.trim());
                            
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        if (data.log) {
                                            addLog(data.log, data.type || 'info');
                                        }
                                        if (data.status === 'success') {
                                            addLog(`✅ ${dep.toUpperCase()} 安装成功！`, 'success');
                                        } else if (data.status === 'error') {
                                            addLog(`❌ ${dep.toUpperCase()} 安装失败: ${data.error}`, 'error');
                                        }
                                    } catch (e) {}
                                }
                            }
                        }
                    } catch (error) {
                        addLog(`❌ 安装 ${dep} 时发生错误: ${error.message}`, 'error');
                    }
                }
                
                addLog('', 'info');
                addLog(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
                addLog('🔍 重新检测安装状态...', 'info');
                
                // 重新检测
                await checkDependencies();
                
                const finalCheck = await fetch(`${API_BASE}/api/check-deps`);
                const finalData = await finalCheck.json();
                
                const stillMissing = [];
                if (!finalData.data.ffmpeg) stillMissing.push('FFmpeg');
                if (!finalData.data.python) stillMissing.push('Python');
                
                if (stillMissing.length === 0) {
                    addLog('🎉 所有组件安装完成！', 'success');
                    updateInstallStatus('✅ 安装完成！', 'success');
                    document.getElementById('oneClickInstallBtn').style.display = 'none';
                } else {
                    addLog(`⚠️ 以下组件可能需要手动安装: ${stillMissing.join(', ')}`, 'warning');
                    updateInstallStatus('部分组件需要手动安装', 'error');
                }
                
            } catch (error) {
                addLog(`❌ 发生错误: ${error.message}`, 'error');
                updateInstallStatus('安装过程出错', 'error');
            } finally {
                isInstalling = false;
                closeBtn.disabled = false;
                closeBtn.textContent = '关闭';
                installBtn.disabled = false;
                installBtn.textContent = '🚀 一键安装缺失组件';
            }
        }

        async function loadConfig() {
            // 配置加载（豆包API不需要模型选择）
        }

        function extractDouyinLink(text) {
            const patterns = [
                /https?:\/\/v\.douyin\.com\/[a-zA-Z0-9]+\/?/,
                /https?:\/\/www\.douyin\.com\/video\/\d+/,
                /https?:\/\/www\.iesdouyin\.com\/share\/video\/\d+/
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) return match[0];
            }
            return null;
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertContent = document.getElementById('alertContent');
            
            alertBox.className = 'alert-box show ' + type;
            alertIcon.textContent = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            alertContent.innerHTML = message;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.remove('show');
        }

        function updateProgress(text, percent) {
            document.getElementById('progressText').innerHTML = `<span>${text}</span>`;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        async function extractBasic() {
            const input = document.getElementById('linkInput').value.trim();
            const extractBtn = document.getElementById('extractBtn');
            
            if (!input) {
                showAlert('warning', '请输入抖音分享链接');
                return;
            }

            const link = extractDouyinLink(input);
            if (!link) {
                showAlert('error', '未能识别有效的抖音链接');
                return;
            }

            hideAlert();
            extractBtn.disabled = true;
            extractBtn.innerHTML = '<div class="loading-spinner"></div><span>提取中...</span>';

            try {
                const response = await fetch(`${API_BASE}/api/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data.data);
                } else {
                    showAlert('error', data.error || '提取失败');
                }
            } catch (error) {
                showAlert('error', '服务连接失败');
            } finally {
                extractBtn.disabled = false;
                extractBtn.innerHTML = '<span>📝</span><span>仅提取标题</span>';
            }
        }

        function displayResult(data) {
            currentResult = data;
            const resultSection = document.getElementById('resultSection');
            
            document.getElementById('authorName').textContent = data.author || '-';
            document.getElementById('videoTitle').textContent = data.title || data.description || '-';
            document.getElementById('hashtags').textContent = 
                data.hashtags?.length ? data.hashtags.join(' ') : '-';
            document.getElementById('descriptionBox').textContent = data.description || '-';
            
            resultSection.classList.add('show');
        }

        function copyResult(type) {
            let text = '';
            text = document.getElementById('descriptionBox').textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target.closest('.copy-btn');
                btn.classList.add('copied');
                btn.innerHTML = '<span>✅ 已复制</span>';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<span>📋 复制</span>';
                }, 2000);
            });
        }

        function clearAll() {
            document.getElementById('linkInput').value = '';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('progressSection').classList.remove('show');
            hideAlert();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                extractBasic();
            }
        });
    </script>
</body>
</html>
